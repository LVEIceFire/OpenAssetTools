name: PR 1002 Visual Studio 2022 validation

on:
  push:
    branches:
      - validation/pr1002-upstream-control-vs2022-20260916

jobs:
  build-test:
    name: Visual Studio 2022 ${{ matrix.build_arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_arch: x86
            msbuild_platform: Win32
          - build_arch: x64
            msbuild_platform: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0
      - name: Generate Visual Studio 2022 projects
        shell: pwsh
        env:
          PREMAKE_NO_PROMPT: 1
        run: |
          ./generate.bat
          ./build/premake5.exe vs2022
      - name: Build with warnings as errors
        shell: pwsh
        run: msbuild /m /p:TrackFileAccess=false /p:UseMultiToolTask=true /p:Configuration=Release /p:Platform=${{ matrix.msbuild_platform }} build/OpenAssetTools.sln
      - name: Run all tests
        shell: pwsh
        working-directory: build/lib/Release_${{ matrix.build_arch }}/tests
        run: |
          $combinedExitCode = 0
          ./CommonTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./ObjCommonTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./ObjCompilingTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./ObjLoadingTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./ObjWritingTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./ParserTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./SystemTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./UnlinkingTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./ZoneCodeGeneratorLibTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          ./ZoneCommonTests
          $combinedExitCode = [System.Math]::max($combinedExitCode, $LASTEXITCODE)
          exit $combinedExitCode