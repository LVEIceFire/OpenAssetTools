name: Retry PR 1006 x86 ASan

on:
  push:
    branches:
      - validation/pr1006-x86-asan-retry-20260917

jobs:
  focused-x86:
    name: Visual Studio 2022 x86 ASan focused and stress tests
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Generate Visual Studio 2022 projects
        shell: pwsh
        env:
          PREMAKE_NO_PROMPT: 1
        run: |
          ./generate.bat
          ./build/premake5.exe vs2022

      - name: Build SystemTests with AddressSanitizer
        shell: pwsh
        env:
          CL: /Z7
          LINK: /DEBUG
        run: |
          msbuild /m:2 /t:SystemTests /p:TrackFileAccess=false /p:UseMultiToolTask=false /p:Configuration=Release /p:Platform=Win32 /p:EnableASAN=true /p:GenerateDebugInformation=true build/OpenAssetTools.sln

      - name: Stage AddressSanitizer runtime
        shell: pwsh
        working-directory: build/lib/Release_x86/tests
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $runtime = Get-ChildItem "$installationPath\VC\Tools\MSVC" -Recurse -Filter clang_rt.asan_dynamic-i386.dll |
            Select-Object -First 1
          if (-not $runtime) {
            throw "Could not find the x86 AddressSanitizer runtime."
          }
          Copy-Item $runtime.FullName .

      - name: Run focused and stress XBlock tests
        shell: pwsh
        working-directory: build/lib/Release_x86/tests
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
        run: |
          & ./SystemTests.exe "[zone-loading][stream]"
          $focusedExitCode = $LASTEXITCODE
          & ./SystemTests.exe "[zone-loading][stream][stress]"
          $stressExitCode = $LASTEXITCODE
          if ($focusedExitCode -ne 0 -or $stressExitCode -ne 0) {
            exit 1
          }
