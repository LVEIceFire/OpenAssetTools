name: Validate PR 1006 on Windows

on:
  push:
    branches:
      - validation/pr1006-current-upstream-20260917

jobs:
  focused-asan:
    name: Visual Studio 2022 ${{ matrix.build_arch }} ASan focused XBlock tests
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_arch: x86
            msbuild_platform: Win32
            runtime_name: clang_rt.asan_dynamic-i386.dll
          - build_arch: x64
            msbuild_platform: x64
            runtime_name: clang_rt.asan_dynamic-x86_64.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Generate Visual Studio 2022 projects
        shell: pwsh
        env:
          PREMAKE_NO_PROMPT: 1
        run: |
          ./generate.bat
          ./build/premake5.exe vs2022

      - name: Build with AddressSanitizer
        shell: pwsh
        env:
          CL: /Z7
          LINK: /DEBUG
        run: |
          msbuild /m:2 /p:TrackFileAccess=false /p:UseMultiToolTask=false /p:Configuration=Release /p:Platform=${{ matrix.msbuild_platform }} /p:EnableASAN=true /p:GenerateDebugInformation=true build/OpenAssetTools.sln

      - name: Stage AddressSanitizer runtime
        shell: pwsh
        working-directory: build/lib/Release_${{ matrix.build_arch }}/tests
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $runtime = Get-ChildItem "$installationPath\VC\Tools\MSVC" -Recurse -Filter '${{ matrix.runtime_name }}' |
            Select-Object -First 1
          if (-not $runtime) {
            throw "Could not find the AddressSanitizer runtime ${{ matrix.runtime_name }}."
          }
          Copy-Item $runtime.FullName .

      - name: Run focused XBlock tests
        shell: pwsh
        working-directory: build/lib/Release_${{ matrix.build_arch }}/tests
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
        run: |
          & ./SystemTests.exe "[zone-loading][stream]"
          exit $LASTEXITCODE

  full-suite:
    name: Visual Studio 2022 ${{ matrix.build_arch }} full suite
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_arch: x86
            msbuild_platform: Win32
          - build_arch: x64
            msbuild_platform: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Generate Visual Studio 2022 projects
        shell: pwsh
        env:
          PREMAKE_NO_PROMPT: 1
        run: |
          ./generate.bat
          ./build/premake5.exe vs2022

      - name: Build Release
        shell: pwsh
        run: msbuild /m /p:TrackFileAccess=false /p:UseMultiToolTask=true /p:Configuration=Release /p:Platform=${{ matrix.msbuild_platform }} build/OpenAssetTools.sln

      - name: Run all tests and preserve every failure
        shell: pwsh
        working-directory: build/lib/Release_${{ matrix.build_arch }}/tests
        run: |
          $combinedExitCode = 0
          $tests = @(
            "CommonTests",
            "ObjCommonTests",
            "ObjCompilingTests",
            "ObjLoadingTests",
            "ObjWritingTests",
            "ParserTests",
            "SystemTests",
            "UnlinkingTests",
            "ZoneCodeGeneratorLibTests",
            "ZoneCommonTests"
          )
          foreach ($test in $tests) {
            Write-Host "Running $test"
            & "./$test.exe"
            $testExitCode = $LASTEXITCODE
            Write-Host "$test exit code: $testExitCode"
            if ($testExitCode -ne 0) {
              $combinedExitCode = 1
            }
          }
          exit $combinedExitCode
